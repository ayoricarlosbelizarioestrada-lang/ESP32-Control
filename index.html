<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ESP32 Control Panel</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>ESP32 Control Panel</h1>

            <p class="subtitulo">
                Control remoto mediante Internet
            </p>

            <div class="status">

                <h3>Estado del ESP32</h3>

                <p id="esp32">
                    ⚪ Desconectado
                </p>

            </div>

            <div class="status">

                <h3>Estado del LED</h3>

                <p id="led">
                    🔴 Apagado
                </p>

            </div>

            <div class="botones">

                <button id="btnOn">

                    🟢 Encender

                </button>

                <button id="btnOff">

                    🔴 Apagar

                </button>

            </div>

        </div>

    </div>

<script src="script.js"></script>

</body>

</html>
